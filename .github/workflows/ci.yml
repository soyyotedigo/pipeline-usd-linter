name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src/

      - name: Tests
        run: pytest

      - name: CLI smoke tests
        run: |
          usd-linter tests/fixtures/valid_asset.usda
          usd-linter tests/fixtures/valid_asset.usda --format json
          usd-linter tests/fixtures/task/rig/contextual_rig_maya_demo.usda --task rig --dcc maya --project demo
          python tests/smoke/check_exit_code_2.py
