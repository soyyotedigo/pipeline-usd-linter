[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-usd-linter"
version = "0.1.0"
description = "USD pipeline linter for validating stage structure and composition from the CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Daniel", email = "yo.eldany@gmail.com" }
]
keywords = ["usd", "openusd", "pipeline", "linter", "vfx", "animation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "usd-core>=24.0",
]

[project.urls]
Homepage = "https://github.com/soyyotedigo/pipeline-usd-linter-dev"
Repository = "https://github.com/soyyotedigo/pipeline-usd-linter-dev"
Issues = "https://github.com/soyyotedigo/pipeline-usd-linter-dev/issues"

[project.scripts]
usd-linter = "usd_linter.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "ruff>=0.11",
  "mypy>=1.10",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
